<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spamhaus Reputation Checker</title>
    <meta name="description" content="Check domain email deliverability scores, SPF, DKIM, DMARC, MX records and Spamhaus blacklist status.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <h1>Spamhaus Reputation Checker</h1>
            <p>Check domain reputations, email deliverability scores & blacklist status.</p>
            
            <div class="mode-toggles">
                <button class="toggle-btn active" id="btn-domains">Domains</button>
                <button class="toggle-btn" id="btn-ips">IP Addresses</button>
            </div>
        </header>

        <main class="app-main">
            
            <div class="input-section">
                <textarea id="target-input" placeholder="Enter domains here, one per line..." spellcheck="false">himado.in
hltv.org
hochi.news
huaban.com
index.hu</textarea>
            </div>

            <div class="action-buttons">
                <button id="btn-check" class="btn btn-primary">
                    <i data-lucide="loader-2" class="spin-icon hidden" id="check-spinner"></i>
                    <span id="check-text">Checking...</span>
                </button>
                <button id="btn-clear" class="btn btn-secondary">
                    <i data-lucide="trash-2"></i> Clear
                </button>
                <button id="btn-export" class="btn btn-success">
                    <i data-lucide="download"></i> Export CSV
                </button>
            </div>

            <div class="progress-section hidden" id="progress-container">
                <div class="progress-header">
                    <span>Processing...</span>
                    <span id="progress-text">0 / 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="results-section">
                <div class="filters-row">
                    <div class="status-filter">
                        <label>STATUS FILTER:</label>
                        <div class="status-toggles">
                            <button class="status-btn active" data-status="All">All</button>
                            <button class="status-btn" data-status="Clean">Clean</button>
                            <button class="status-btn" data-status="Listed">Listed</button>
                        </div>
                    </div>
                    
                    <div class="score-range-filter">
                        <label>EMAIL SCORE RANGE:</label>
                        <div class="score-inputs">
                            <input type="number" id="score-min" placeholder="Min" step="0.1" min="0" max="10">
                            <span>-</span>
                            <input type="number" id="score-max" placeholder="Max" step="0.1" min="0" max="10">
                        </div>
                    </div>
                </div>
                <div class="filters-row">
                    <div class="grade-filter">
                        <label>EMAIL GRADE FILTER:</label>
                        <div class="grade-toggles">
                            <button class="grade-btn active" data-grade="All">All</button>
                            <button class="grade-btn grade-btn-excellent" data-grade="A+">A+</button>
                            <button class="grade-btn grade-btn-good" data-grade="A">A</button>
                            <button class="grade-btn grade-btn-average" data-grade="B">B</button>
                            <button class="grade-btn grade-btn-below" data-grade="C">C</button>
                            <button class="grade-btn grade-btn-poor" data-grade="D">D</button>
                            <button class="grade-btn grade-btn-fail" data-grade="F">F</button>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th id="th-target">TARGET <i data-lucide="arrow-up-down" class="sort-icon"></i></th>
                                <th id="th-score">SCORE <i data-lucide="arrow-up-down" class="sort-icon"></i></th>
                                <th id="th-email-score">EMAIL SCORE <i data-lucide="arrow-up-down" class="sort-icon"></i></th>
                                <th id="th-smtp">SMTP</th>
                                <th id="th-status">STATUS</th>
                                <th id="th-details">DETAILS</th>
                            </tr>
                        </thead>
                        <tbody id="results-tbody">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Email Details Modal -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal-container" id="modal-container">
            <div class="modal-header">
                <h2 id="modal-domain-title">domain.com</h2>
                <button class="modal-close" id="modal-close">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
